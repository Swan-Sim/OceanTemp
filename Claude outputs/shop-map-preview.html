<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>샵 지도 표시 시안</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#e2e8f0;font-family:-apple-system,system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .note{position:absolute;z-index:1000;left:10px;right:10px;bottom:12px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.55}
  .tog{position:absolute;z-index:1000;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
  .tog button{background:rgba(15,23,42,.85);color:#cbd5e1;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .tog button.on{background:#f59e0b;color:#111;border-color:#f59e0b}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:#dc2626;box-sizing:border-box;box-shadow:0 0 4px rgba(0,0,0,.6)}
  .lbl{position:absolute;left:17px;top:-2px;white-space:nowrap;padding:2px 6px;font-size:10.5px;font-weight:600;color:#f8fafc;background:rgba(15,23,42,.72);border:.8px solid rgba(255,255,255,.4);border-radius:4px}
  .pin{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.6);border:2px solid #fff;box-sizing:border-box}
  .pin.shop{background:#f59e0b}.pin.liveaboard{background:#8b5cf6}.pin.pool{background:#0ea5e9}
  .pin.paid{outline:2px solid #fde68a;outline-offset:2px}
  .leaflet-popup-content-wrapper{background:#0f172a;color:#e2e8f0;border-radius:12px;border:1px solid rgba(255,255,255,.15)}
  .leaflet-popup-tip{background:#0f172a}
  .card h3{margin:0 0 2px;font-size:15px}.card .t{font-size:11.5px;color:#94a3b8;margin-bottom:8px}
  .card .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .card .row a{font-size:12px;font-weight:700;color:#111;background:#f59e0b;border-radius:999px;padding:5px 10px;text-decoration:none}
  .card .sp{font-size:12px;color:#cbd5e1}.card .sp b{color:#fff}
  .card .pf{font-size:12px;color:#cbd5e1;line-height:1.6}
  .tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:#334155;color:#e2e8f0;margin-left:4px;vertical-align:2px}
</style></head><body>
<div id="map"></div>
<div class="tog"><button id="tShop" class="on">🏪 샵 ON</button><button id="tPool" class="on">🏊 풀장 ON</button></div>
<div class="note">시안: 확대 11 이상에서 정점(빨간 점) 옆에 <b>샵(주황)·리브어보드(보라)·풀장(하늘)</b> 아이콘이 보여요. 아이콘을 누르면 연락 버튼과 연결된 포인트가 나와요. 오른쪽 위 버튼으로 켜고 끄기. (샘플 샵·풀장은 예시 데이터)</div>
<script>
const SP=[["Doljo Point",9.59237,123.72248],["Pungtud Wall",9.57368,123.71327],["Kalipayan",9.54157,123.76065],["Garden Eels",9.54518,123.771],["ClubHari Beach",9.5471,123.75152],["Napaling",9.61735,123.77108],["Habagat Wreck",9.54013,123.75597],["Danao Wall",9.53998,123.75189],["Alona House Reef",9.54569,123.77113],["Tawala MPA",9.54887,123.79789],["Arco Point",9.57096,123.81849],["Black Forest",9.51483,123.68893],["Cathedral",9.5204,123.6846],["Divers Heaven",9.51842,123.68788]];
const SHOPS=[
 {type:'shop',name:'ClubHari',lat:9.5482,lon:123.7522,paid:true,c:['전화','카카오','인스타그램'],spots:['ClubHari Beach','Danao Wall','Habagat Wreck','Kalipayan','Black Forest','Cathedral'],note:'한국인 강사 · 교육/펀다이빙'},
 {type:'shop',name:'샘플 다이브샵 A',lat:9.5503,lon:123.7712,c:['WhatsApp','웹사이트'],spots:['Garden Eels','Alona House Reef','Tawala MPA','Arco Point']},
 {type:'liveaboard',name:'샘플 리브어보드',lat:9.5515,lon:123.7790,c:['웹사이트'],spots:['Black Forest','Cathedral','Divers Heaven','Napaling','Arco Point']},
 {type:'pool',name:'샘플 다이빙 풀장',lat:9.5620,lon:123.7650,pf:'최대 수심 6m · 수온 30°C · 실외<br>스쿠버·교육 · 입장: 샵 통해서 · 매일 08–18시'}];
const map=L.map('map',{zoomControl:false}).setView([9.553,123.762],13);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(map);
SP.forEach(([n,a,o])=>L.marker([a,o],{icon:L.divIcon({className:'',html:`<div style="position:relative"><div class="dot"></div><div class="lbl">${n}</div></div>`,iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map));
const ICON={shop:'🏪',liveaboard:'🛥️',pool:'🏊'},TNAME={shop:'다이브샵',liveaboard:'리브어보드',pool:'다이빙 풀장'};
const layers={shop:L.layerGroup().addTo(map),pool:L.layerGroup().addTo(map)};
SHOPS.forEach(s=>{
  const m=L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:`<div class="pin ${s.type}${s.paid?' paid':''}">${ICON[s.type]}</div>`,iconSize:[28,28],iconAnchor:[14,14]}),zIndexOffset:500});
  const body=s.type==='pool'?`<div class="pf">${s.pf}</div>`:`<div class="row">${s.c.map(x=>`<a href="#">${x}</a>`).join('')}</div><div class="sp">다니는 포인트: <b>${s.spots.join(' · ')}</b></div>`;
  m.bindPopup(`<div class="card"><h3>${s.name}${s.paid?'<span class="tag">제휴</span>':''}</h3><div class="t">${TNAME[s.type]}${s.note?' · '+s.note:''}</div>${body}</div>`,{maxWidth:260});
  (s.type==='pool'?layers.pool:layers.shop).addLayer(m);
});
const sync=()=>{const z=map.getZoom();['shop','pool'].forEach(k=>{const on=document.getElementById(k==='shop'?'tShop':'tPool').classList.contains('on')&&z>=11;on?layers[k].addTo(map):map.removeLayer(layers[k]);});};
['tShop','tPool'].forEach(id=>document.getElementById(id).onclick=e=>{const b=e.currentTarget;b.classList.toggle('on');b.textContent=b.textContent.replace(/ON|OFF/,b.classList.contains('on')?'ON':'OFF');sync();});
map.on('zoomend',sync);
</script></body></html>
