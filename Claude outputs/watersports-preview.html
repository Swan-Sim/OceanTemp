<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수상레저 포인트 시안</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#0b1220;color:#e2e8f0;font-family:-apple-system,system-ui,sans-serif}
#map{position:absolute;left:0;right:0;top:0;bottom:46%}
#panel{position:absolute;left:0;right:0;bottom:0;height:46%;background:#0f172a;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column}
.bar{position:absolute;z-index:1000;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(15,23,42,.88);padding:6px;border-radius:999px;border:1px solid rgba(255,255,255,.15)}
.bar button{background:transparent;color:#cbd5e1;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.bar button.on{background:#f59e0b;color:#111;border-color:#f59e0b}
.flt{position:absolute;z-index:1000;right:8px;top:58px;display:flex;flex-direction:column;gap:5px}
.flt button{display:flex;align-items:center;gap:6px;background:rgba(15,23,42,.85);color:#cbd5e1;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 10px 4px 5px;font-size:11.5px;font-weight:600;cursor:pointer}
.flt button.off{opacity:.4}
.ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.6);box-sizing:border-box}
.ic svg{width:14px;height:14px}
.ic.dive{background:#dc2626}.ic.surf{background:#0891b2}.ic.wind{background:#059669}.ic.paddle{background:#d97706}.ic.row{background:#db2777}
.ic.sel{outline:2px solid #fde047;outline-offset:2px}
.more{position:absolute;right:-6px;top:-6px;background:#f8fafc;color:#0f172a;font-size:8.5px;font-weight:800;border-radius:999px;padding:0 3px;line-height:12px}
.lbl{position:absolute;left:26px;top:2px;white-space:nowrap;padding:1px 6px;font-size:10.5px;font-weight:600;color:#f8fafc;background:rgba(15,23,42,.72);border:.8px solid rgba(255,255,255,.4);border-radius:4px}
.head{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;flex-wrap:wrap}
.head b{font-size:15px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px 2px 3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.chip .ic{width:16px;height:16px;border-width:1px}.chip .ic svg{width:10px;height:10px}
.face{font-size:11px;color:#94a3b8}
.scroll{overflow-x:auto;overflow-y:hidden;flex:1;padding:0 0 6px}
.tbl{display:flex}
.labels{position:sticky;left:0;z-index:2;background:#0f172a;flex:0 0 74px;font-size:10px;color:#94a3b8}
.labels div,.col div{height:20px;display:flex;align-items:center}
.labels div{padding-left:10px;white-space:nowrap}
.col{flex:0 0 34px;text-align:center;font-size:11px}
.col div{justify-content:center}
.col.now{background:rgba(250,204,21,.07)}
.col.day{border-left:1px solid rgba(255,255,255,.12)}
.g{width:28px;height:12px;border-radius:3px}
.g.good{background:#22c55e}.g.ok{background:rgba(250,204,21,.65)}.g.no{background:rgba(255,255,255,.05)}
.note{font-size:11.5px;line-height:1.5;color:#cbd5e1;padding:4px 12px 8px;border-top:1px solid rgba(255,255,255,.07)}
.lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}.lg i{display:inline-block;width:12px;height:9px;border-radius:2px}
.leaflet-popup-content-wrapper{background:#0f172a;color:#e2e8f0;border-radius:10px}.leaflet-popup-tip{background:#0f172a}
</style></head><body>
<div id="map"></div>
<div class="bar"><button data-m="A" class="on">A 종목별 좋은 시간</button><button data-m="B">B 지금 표 + 종목 표시</button></div>
<div class="flt" id="flt"></div>
<div id="panel"><div class="head" id="head"></div><div class="scroll" id="sc"><div class="tbl" id="tbl"></div></div><div class="note" id="note"></div></div>
<script>
// ── 종목 아이콘(작은 그림) ──
const SVG={
 dive:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="8" width="18" height="9" rx="4"/><path d="M12 8v9"/></svg>',
 surf:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M2 16c3 0 3-3 6-3s3 3 6 3 3-3 6-3"/><path d="M4 11c1-4 5-7 10-6-3 1-4 3-4 6"/></svg>',
 wind:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M11 3v15"/><path d="M11 3c4 3 6 8 6 13h-6"/><path d="M4 20h16"/></svg>',
 paddle:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 19L17 7"/><ellipse cx="18.5" cy="5.5" rx="2" ry="3.5" transform="rotate(45 18.5 5.5)"/><path d="M3 21h8"/></svg>',
 row:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 15h18l-2 3H5z"/><path d="M6 6l4 9M18 6l-4 9"/></svg>'};
const SPORT={dive:'다이빙',surf:'서핑',wind:'윈드서핑·카이트·윙',paddle:'SUP·카약',row:'조정(Rowing)'};
const ORDER=['wind','surf','paddle','row','dive'];
// ── 샘플 포인트(위치는 대략, 시안용) - face = 바다가 있는 방향(°) ──
const SP=[
 {n:'Crissy Field',s:['wind'],la:37.8070,lo:-122.4600,face:0,note:'오후 서풍(바다바람)이 강해요 · 조류 강함'},
 {n:'Fort Point',s:['surf'],la:37.8100,lo:-122.4760,face:330},
 {n:'Ocean Beach',s:['surf'],la:37.7600,lo:-122.5135,face:270},
 {n:'Aquatic Park',s:['row','paddle'],la:37.8080,lo:-122.4228,face:0,note:'방파제 안 잔잔한 물'},
 {n:'Mission Creek',s:['paddle'],la:37.7735,lo:-122.3930,face:90},
 {n:'Lake Merced',s:['row'],la:37.7240,lo:-122.4920,face:0,note:'호수'},
 {n:'Richardson Bay',s:['paddle','wind'],la:37.8660,lo:-122.4880,face:135},
 {n:'Candlestick Point',s:['wind'],la:37.7140,lo:-122.3790,face:90,note:'서풍이 육지에서 불어 사이드오프'},
 {n:'3rd Ave (Foster City)',s:['wind'],la:37.5620,lo:-122.2490,face:70},
 {n:'Linda Mar (Pacifica)',s:['surf','paddle'],la:37.5960,lo:-122.5030,face:270},
 {n:'Lake Merritt',s:['row','paddle'],la:37.8020,lo:-122.2570,face:0,note:'호수'}];
// ── 종목별 "탈 만한" 기준(시안 값, 나중에 조정) ──
// 바람(kn), 파고(m), 주기(s). side = 해안 방향 기준 바람 종류
function sideOf(wdir,face){ // wdir = 바람이 불어오는 방향, face = 바다 방향
  const d=Math.abs(((wdir-face+540)%360)-180); // 0 = 바다에서 불어옴(온쇼어), 180 = 육지에서(오프쇼어)
  return d<=45?'on':d<=80?'side-on':d<=110?'side':d<=140?'side-off':'off';}
const SIDE_KO={on:'온쇼어','side-on':'사이드온',side:'사이드',"side-off":'사이드오프',off:'오프쇼어'};
function rate(sport,h,sp){const w=h.w,g=h.g,s=sideOf(h.d,sp.face),lake=/호수|방파제/.test(sp.note||'');
 if(sport==='wind'){if(s==='off')return'no'; if(w>=14&&w<=25&&g<=w*1.5)return'good'; if(w>=11&&w<=30)return'ok';return'no';}
 if(sport==='surf'){if(h.wv<0.6)return'no'; const clean=w<8||s==='off'||s==='side-off'; if(h.wv>=0.9&&h.wv<=2.5&&h.p>=10&&clean)return'good'; if(h.wv<=3.2&&(clean||w<14))return'ok';return'no';}
 if(sport==='paddle'){const wv=lake?0:h.wv; if(s==='off'&&w>=8)return'no'; if(w<=8&&wv<=0.5)return'good'; if(w<=12&&wv<=0.9)return'ok';return'no';}
 if(sport==='row'){const wv=lake?0:h.wv; if(w<=7&&wv<=0.3)return'good'; if(w<=11&&wv<=0.6)return'ok';return'no';}
 return'ok';}
// ── 샘플 예보(오후에 서풍이 세지는 샌프란시스코 여름형) ──
const now=new Date();now.setMinutes(0,0,0);const H=[];
for(let i=-6;i<42;i++){const t=new Date(now.getTime()+i*3600e3),hr=t.getHours();
 const sea=Math.max(0,Math.sin((hr-10)/10*Math.PI)); const day=i>24?0.75:1;
 const w=Math.round(4+18*sea*day+(i%5)*0.6), g=Math.round(w*1.3+2), d=hr<9?120+hr*8:280+Math.round(sea*15);
 H.push({t,w,g,d,wv:+(1.2+0.5*Math.sin(i/9)).toFixed(1),p:Math.round(11+2*Math.sin(i/14)),tide:+(1.0+0.9*Math.sin(i/12.4*2*Math.PI)).toFixed(2),temp:+(13.5+0.6*sea).toFixed(1)});}
// ── 지도 ──
let mode='A',sel=SP[0];const off=new Set();
const map=L.map('map',{zoomControl:false}).setView([37.76,-122.40],10);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(map);
const marks=SP.map(sp=>{const main=ORDER.find(k=>sp.s.includes(k));
 const m=L.marker([sp.la,sp.lo],{icon:L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],html:`<div style="position:relative"><div class="ic ${main}">${SVG[main]}${sp.s.length>1?`<span class="more">+${sp.s.length-1}</span>`:''}</div><div class="lbl">${sp.n}</div></div>`})}).addTo(map);
 m.on('click',()=>{sel=sp;draw();});m._sp=sp;return m;});
const flt=document.getElementById('flt');
['wind','surf','paddle','row','dive'].forEach(k=>{const b=document.createElement('button');b.innerHTML=`<span class="ic ${k}" style="width:18px;height:18px">${SVG[k]}</span>${SPORT[k]}`;
 b.onclick=()=>{off.has(k)?off.delete(k):off.add(k);b.classList.toggle('off',off.has(k));marks.forEach(m=>{const vis=m._sp.s.some(s=>!off.has(s));vis?m.addTo(map):map.removeLayer(m);});};flt.appendChild(b);});
// ── 표 ──
const arrow=d=>`<svg width="11" height="11" viewBox="0 0 12 12" style="transform:rotate(${(d+180)%360}deg)"><path d="M6 10.5V1.8M6 1.5 2.6 4.9M6 1.5l3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;
const wcol=w=>w>=25?'#f87171':w>=18?'#fb923c':w>=12?'#4ade80':w>=7?'#a3e635':'#94a3b8';
function draw(){
 marks.forEach(m=>{const e=m.getElement();if(e)e.querySelector('.ic').classList.toggle('sel',m._sp===sel)});
 const sp=sel,ko=SIDE_KO;
 document.getElementById('head').innerHTML=`<b>${sp.n}</b>`+sp.s.map(k=>`<span class="chip"><span class="ic ${k}">${SVG[k]}</span>${SPORT[k]}</span>`).join('')+`<span class="face">바다 방향 ${['북','북동','동','남동','남','남서','서','북서'][Math.round(sp.face/45)%8]}${sp.note?' · '+sp.note:''}</span>`;
 const rows=[];
 if(mode==='A') sp.s.forEach(k=>rows.push({lab:`<span class="ic ${k}" style="width:15px;height:15px;display:inline-flex;margin-right:4px">${SVG[k]}</span>${k==='wind'?'바람':SPORT[k].split('·')[0]}`,f:h=>`<span class="g ${rate(k,h,sp)}"></span>`}));
 rows.push({lab:'',f:h=>h.t.getHours()===0||h===H[0]?`<b style="font-size:10px">${h.t.getMonth()+1}/${h.t.getDate()}</b>`:''});
 rows.push({lab:'시각',f:h=>`<span style="color:#8A94A6">${String(h.t.getHours()).padStart(2,'0')}</span>`});
 rows.push({lab:mode==='A'?'바람 kn':'바람 m/s',f:h=>`<b style="color:${wcol(h.w)}">${mode==='A'?h.w:(h.w*0.514).toFixed(0)}</b>`});
 rows.push({lab:'돌풍',f:h=>`<span style="color:#64748b">${mode==='A'?h.g:(h.g*0.514).toFixed(0)}</span>`});
 rows.push({lab:'방향',f:h=>`<span style="color:#94a3b8">${arrow(h.d)}</span>`});
 if(mode==='A') rows.push({lab:'해안 기준',f:h=>{const s=sideOf(h.d,sp.face);return `<span style="font-size:8.5px;color:${s==='off'?'#f87171':s==='on'||s==='side-on'?'#93c5fd':'#cbd5e1'}">${{on:'온','side-on':'사온',side:'사이드','side-off':'사오',off:'오프'}[s]}</span>`}});
 rows.push({lab:'파고 m',f:h=>h.wv.toFixed(1)});rows.push({lab:'주기',f:h=>`<span style="color:#64748b">${h.p}s</span>`});
 if(mode==='B') rows.push({lab:'수온 °C',f:h=>h.temp});
 rows.push({lab:'조위 m',f:h=>`<span style="color:#7DD3FC;font-size:10px">${h.tide.toFixed(1)}</span>`});
 const nowI=6;
 document.getElementById('tbl').innerHTML=`<div class="labels">${rows.map(r=>`<div>${r.lab}</div>`).join('')}</div>`+H.map((h,i)=>`<div class="col${i===nowI?' now':''}${h.t.getHours()===0?' day':''}">${rows.map(r=>`<div>${r.f(h)}</div>`).join('')}</div>`).join('');
 document.getElementById('sc').scrollLeft=Math.max(0,nowI*34-80);
 document.getElementById('note').innerHTML=mode==='A'
  ?`<b>A</b> 포인트 종목마다 맨 위에 "탈 만한 시간" 줄: <span class="lg"><i style="background:#22c55e"></i>좋음</span><span class="lg"><i style="background:rgba(250,204,21,.65)"></i>가능</span><span class="lg"><i style="background:rgba(255,255,255,.12)"></i>별로</span><br>바람 종목은 kn(노트) 단위, 해안 방향 기준 온쇼어/사이드/오프쇼어(오프쇼어=육지에서 불어 위험)도 표시. 기준값: 바람 14–25kn 좋음 · 서핑 파고 0.9–2.5m·주기 10s↑·바람 약하거나 오프쇼어 · SUP 8kn↓ · 조정 7kn↓. <i>(샘플 예보·대략 위치)</i>`
  :`<b>B</b> 지금 다이빙 표를 그대로 쓰고, 이름 옆에 종목만 표시. 판단은 사용자 몫이에요. <i>(샘플 예보·대략 위치)</i>`;
}
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));draw();});
map.whenReady(()=>setTimeout(draw,50));
</script></body></html>
