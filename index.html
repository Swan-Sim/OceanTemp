<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 홈 화면에 추가했을 때 주소창 없는 전체화면(standalone)으로 실행되도록 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#010409">
  <title>Global Ocean Temp Monitor</title>

  <!-- Three.js (3D 지구공) -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <!-- Leaflet (평면 위성 지도) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 육지/바다 판정용: d3-geo + TopoJSON (Natural Earth 공개 지리 데이터) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.1.0/topojson.min.js"></script>

  <link rel="stylesheet" href="css/styles.css">

</head>
<body>

  <div class="rotate-overlay" id="rotate-overlay">
    <div class="icon">📱↻</div>
    <div class="msg" id="txt-rotate-msg">화면을 세로로 돌려주세요 — 가로모드에서는 화면이 너무 좁아 지구본과 그래프를 함께 보기 어려워요.</div>
  </div>

  <header>
    <span id="txt-app-title">전 세계 해양 수온 모니터링 (3D 위성 지구공)</span>
    <span class="badge-count" id="point-counter">로딩 중...</span>
  </header>

  <main>
    <div id="viewport-container">
      <div id="boot-screen">
        <div id="boot-progress-wrap">
          <div id="boot-progress-bar"><div id="boot-progress-fill"></div></div>
          <div id="boot-progress-label">BOOTING...</div>
        </div>
      </div>

      <div class="hud-overlay">
        <div class="color-legend">
          <span id="legend-min">0°C</span>
          <div class="legend-bar"></div>
          <span id="legend-max">32°C+</span>
        </div>
      </div>

      <!-- [ADD] "검색창에서 항구명 입력하면 확대된 화면으로 전환" 요청 반영 -
           돋보기 버튼을 누르면 펼쳐지는 검색 패널. 영문/한글 이름 둘 다 검색되고,
           결과를 고르면 상세지도(평면도)로 바로 전환됩니다. -->
      <div id="search-panel" class="search-panel">
        <input type="text" id="search-input" class="search-input" placeholder="항구·해변 이름 검색 (한글/영문)" />
        <div id="search-results" class="search-results"></div>
      </div>

      <!-- [ADD] "로딩 화면에서 위치 공유 안 한 사용자에게 대륙 선택/현재 위치/검색
           제공" 요청 반영 - 부팅 시작과 동시에 보이고, 자동 위치 감지가 성공하거나
           사용자가 여기서 뭔가 고르면 그쪽이 우선해서 화면이 그 방향으로 자리잡습니다. -->
      <div id="boot-location-widget">
        <button id="boot-locate-btn" class="boot-widget-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2 4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
          내 위치로 보기
        </button>
        <div class="boot-search-wrap">
          <input type="text" id="boot-search-input" class="search-input" placeholder="항구·해변 이름 검색 (한글/영문)" />
          <div id="boot-search-results" class="search-results"></div>
        </div>
        <div id="boot-continent-chips" class="continent-chips">
          <button class="chip-btn" data-continent="asia">아시아</button>
          <button class="chip-btn" data-continent="europe">유럽</button>
          <button class="chip-btn" data-continent="africa">아프리카</button>
          <button class="chip-btn" data-continent="namerica">북미</button>
          <button class="chip-btn" data-continent="samerica">남미</button>
          <button class="chip-btn" data-continent="oceania">오세아니아</button>
        </div>
      </div>

      <div class="map-controls">
        <button class="ctrl-btn" id="btn-search-toggle" onclick="toggleSearchPanel()" title="검색">🔍</button>
        <button class="ctrl-btn" onclick="zoomIn()">+</button>
        <div class="zoom-slider-wrap" id="zoom-gauge-wrap">
          <div class="zoom-track">
            <div class="zoom-fill" id="zoom-fill"></div>
            <div class="zoom-handle" id="zoom-handle"></div>
          </div>
        </div>
        <button class="ctrl-btn" onclick="zoomOut()">−</button>
        <button class="ctrl-btn" onclick="locateUser()" title="내 위치로" id="btn-locate">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2 4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
        </button>
        <button class="ctrl-btn" onclick="toggleMoonTide()" title="달·조석 격자 켜기/끄기" id="btn-moon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5z"/></svg>
        </button>
        <button class="ctrl-btn" onclick="toggleFullscreen()" title="전체화면" style="font-size: 13px;" id="btn-fullscreen">⛶</button>
        <button class="ctrl-btn" onclick="toggleTempUnit()" style="font-size: 12px; font-weight:700;" id="btn-reset">°C</button>
      </div>

      <!-- 3D 위성 지구공 레이어 -->
      <div id="globe-canvas-container"></div>

      <!-- 평면 상세 위성 지도 레이어 -->
      <div id="leafletMap"></div>

      <div class="disclaimer-bar">
        ⚠️ <b id="txt-disclaimer-label">Disclaimer:</b> <span id="txt-disclaimer-body">본 서비스의 수온 관측치, 과거 통계 및 추정 모델은 참고용 정보이며 시차나 관측 오차가 발생할 수 있습니다. 항해, 조난 구조 및 극한 해양 레저 활동의 안전 판단에 대한 법적 책임을 지지 않습니다.</span>
      </div>
    </div>

    <section id="bottom-sheet">
      <div id="boot-terminal"></div>
      <div class="meta-row">
        <div class="station-name" id="st-name">정점을 선택하세요</div>
        <div class="temp-val" id="st-temp">--.-°C</div>
      </div>
      <div class="station-sub" id="st-info">위도 / 경도 / 관측망</div>
      <div class="station-cond" id="st-cond" style="display:none"></div>

      <div class="tab-bar">
        <button class="tab-btn active" id="btn-now" onclick="setMode('now')">실시간 현황 (Now)</button>
        <button class="tab-btn" id="btn-ts" onclick="setMode('forecast')">과거 5~6년 평균 vs 1년 추정</button>
        <button class="tab-btn" id="btn-dp" onclick="setMode('depth')">수심별 수온 (CTD/Argo)</button>
      </div>

      <div class="chart-box">
        <canvas id="detailChart"></canvas>
        <div class="chart-legend-overlay" id="chart-legend"></div>
        <div class="now-table" id="now-table" style="display:none"></div>
      </div>
    </section>
  </main>

  <script src="js/data-worldtopo.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/live-data.js"></script>
  <script src="js/land-utils.js"></script>
  <script src="js/i18n-and-input.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/panel-charts.js"></script>
  <script src="js/astronomy.js"></script>
  <script src="js/space-decor.js"></script>
  <script src="js/globe-scene.js"></script>
  <script src="js/detail-map.js"></script>
  <script src="js/boot-sequence.js"></script>
  <script src="js/search-nav.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
