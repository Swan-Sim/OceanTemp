<!-- [ADD] 다이빙샵 등록 / 수정 페이지.

<style>

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  a { color: var(--accent); }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }

  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; } label b { color: var(--accent); font-weight: 600; }
  input, textarea, select { width: 100%; font: inherit; font-size: 15px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  input:focus, textarea:focus { outline: none; border-color: rgba(255,176,0,.6); }
  textarea { min-height: 70px; resize: vertical; }
  .hint { font-size: 11.5px; color: var(--dim); margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; } @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 6px 5px 10px; border-radius: 999px; background: rgba(255,176,0,.12); border: 1px solid rgba(255,176,0,.4); }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 3px; }
  .sugg { border: 1px solid var(--line); border-radius: 9px; margin-top: 4px; max-height: 220px; overflow: auto; display: none; }
  .sugg div { padding: 8px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--line); } .sugg div:hover { background: rgba(255,255,255,.05); }
  .sugg small { color: var(--dim); margin-left: 6px; }
  .agree { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 14px; }
  .agree input { width: auto; margin-top: 3px; }
  .btn { display: inline-block; font: inherit; font-size: 15px; font-weight: 700; padding: 12px 18px; border-radius: 10px; border: 1px solid rgba(255,176,0,.6); background: rgba(255,176,0,.16); color: #ffd27a; cursor: pointer; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); font-weight: 600; font-size: 13px; padding: 8px 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 13px; margin-top: 10px; } .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  .status { font-size: 13px; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; border: 1px solid var(--line); }
  .status.pending { border-color: rgba(255,176,0,.4); color: #ffd27a; } .status.live { border-color: rgba(52,211,153,.4); color: var(--ok); }
  .link { word-break: break-all; font-size: 13px; background: var(--bg); border: 1px dashed rgba(255,176,0,.5); border-radius: 9px; padding: 10px 12px; margin: 8px 0; }
  .hp { position: absolute; left: -9999px; }
  .lang { font-size: 12px; }
  .per.on { color: var(--text); border-color: rgba(255,176,0,.6); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; } .kpi span { font-size: 11.5px; color: var(--muted); }
  table.st { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.st th { text-align: right; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.st th:first-child, table.st td:first-child { text-align: left; }
  table.st td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  table.st td small { display: block; color: var(--dim); font-size: 11px; }

const token = (() => { const m = location.hash.match(/t=([\w-]{10,100})/); return m ? m[1] : ''; })();

function applyLang() {
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-k]').forEach(el => { const v = L[el.dataset.k]; if (typeof v === 'string') el.textContent = v; });

  if (token) { $('title').textContent = L.titleEdit; document.querySelector('.lead').textContent = L.leadEdit; $('submitBtn').textContent = L.submitEdit; $('agreeRow').style.display = 'none'; }

let spots = [], picked = [];
function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
async function loadSpots() {
  try {
    let text = await fetch(SHEET).then(r => r.ok ? r.text() : '').catch(() => '');
    if (!/\bno\b/i.test(text.split('\n')[0] || '')) text = await fetch('/data/stations.csv').then(r => r.text());
    const [head, ...rows] = parseCsv(text);
    const ix = Object.fromEntries(head.map((h, i) => [h.trim().toLowerCase(), i]));
    spots = rows.filter(r => !/^n/i.test(ix.show != null ? (r[ix.show] || '') : ''))
      .map(r => ({ no: parseInt(r[ix.no], 10), name: (r[ix.name] || '').trim(), label: (r[ix.label] || '').trim(), country: (r[ix.country] || '').trim() }))
      .filter(s => s.no && s.name);
    const ex = await fetch('/api/shops?svc=spots').then(r => r.json()).catch(() => ({}));
    (ex.spots || []).forEach(s => { if (!spots.some(x => x.no === s.no)) spots.push({ no: s.no, name: s.name, label: s.label, country: s.country }); });
  } catch (e) { console.warn(e); }
  renderChips();
}
const spotName = (no) => { const s = spots.find(x => x.no === no); return s ? (s.label || s.name) : `#${no}`; };
function renderChips() {
  $('chips').innerHTML = picked.map(no => `<span class="chip">${esc(spotName(no))}<button type="button" data-rm="${no}" aria-label="remove">×</button></span>`).join('');
}
$('chips').onclick = (e) => { const b = e.target.closest('[data-rm]'); if (b) { picked = picked.filter(n => n !== +b.dataset.rm); renderChips(); } };
$('spotSearch').oninput = () => {
  const q = $('spotSearch').value.trim().toLowerCase();
  const box = $('sugg');
  if (!q) { box.style.display = 'none'; return; }
  const hits = spots.filter(s => !picked.includes(s.no) && (`${s.name} ${s.label} ${s.country}`).toLowerCase().includes(q)).slice(0, 12);
  box.innerHTML = hits.map(s => `<div data-no="${s.no}">${esc(s.label || s.name)}<small>${esc(s.name !== s.label ? s.name : '')} ${esc(s.country)}</small></div>`).join('');
  box.style.display = hits.length ? 'block' : 'none';
};
$('sugg').onclick = (e) => { const d = e.target.closest('[data-no]'); if (!d) return; picked.push(+d.dataset.no); renderChips(); $('spotSearch').value = ''; $('sugg').style.display = 'none'; $('spotSearch').focus(); };

// ── 보내기 ──
const form = $('f');
function formData() {
  const o = Object.fromEntries(new FormData(form).entries());
  o.spots = picked; o.agree = $('agree').checked || !!token; if (token) o.t = token;
  return o;
}
function fill(d, email) {
  ['name', 'address', 'lang', 'note', 'phone', 'kakao', 'whatsapp', 'instagram', 'web'].forEach(k => { if (form[k]) form[k].value = d[k] || ''; });
  if (d.instagram) form.instagram.value = d.instagram.replace('https://www.instagram.com/', '@');
  form.email.value = email || '';
  picked = (d.spots || []).slice(); renderChips();
}
async function post(svc, body) {
  const r = await fetch(`/api/shops?svc=${svc}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (_) {}
  return { status: r.status, ...j };
}
form.onsubmit = async (e) => {
  e.preventDefault();
  const L = T[lang], btn = $('submitBtn'), msg = $('msg');
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = L.sending;
  const j = await post(token ? 'edit' : 'register', formData()).catch(() => ({}));
  btn.disabled = false; btn.textContent = token ? L.submitEdit : L.submit;
  if (!j.ok) { msg.className = 'msg err'; msg.textContent = L['e_' + j.error] || L.e_default; return; }
  if (token) { editStatus = j.status; showStatus(); msg.className = 'msg ok'; msg.textContent = L.editSaved; return; }
  form.style.display = 'none'; $('lostCard').style.display = 'none';
  $('done').style.display = ''; $('doneLink').textContent = j.url; window.scrollTo(0, 0);
};
$('copyBtn').onclick = async () => { try { await navigator.clipboard.writeText($('doneLink').textContent); $('copyBtn').textContent = T[lang].copied; } catch (_) {} };
$('lostForm').onsubmit = async (e) => {
  e.preventDefault();
  const j = await post('resend', { email: e.target.email.value }).catch(() => ({}));
  $('lostMsg').className = 'msg ok'; $('lostMsg').textContent = j.mail === false ? T[lang].lostNoMail : T[lang].lostOk;
};
let stats = null, statDays = 30;
function renderStats() {
  const L = T[lang];
  if (!stats) { $('statsCard').style.display = 'none'; return; }
  $('statsCard').style.display = '';
  document.querySelectorAll('.per').forEach(b => { b.classList.toggle('on', +b.dataset.days === statDays); b.textContent = L.statDays(+b.dataset.days); });
  const sum = (r) => Object.values(r.clicks).reduce((a, b) => a + b, 0);
  const tot = stats.rows.reduce((a, r) => ({ v: a.v + r.views, i: a.i + r.imp, c: a.c + sum(r) }), { v: 0, i: 0, c: 0 });
  $('kpis').innerHTML = [[tot.v, L.stViews], [tot.i, L.stImp], [tot.c, L.stClicks]].map(([n, l]) => `<div class="kpi"><b>${n.toLocaleString()}</b><span>${esc(l)}</span></div>`).join('');
  $('statsTable').innerHTML = `<tr><th>${esc(L.stSpot)}</th><th>${esc(L.thShort[0])}</th><th>${esc(L.thShort[1])}</th><th>${esc(L.thShort[2])}</th></tr>` +
    stats.rows.map(r => `<tr><td>${r.no ? esc(spotName(r.no)) : esc(L.stOther)}</td><td>${r.no ? r.views.toLocaleString() : '–'}</td><td>${r.no ? r.imp.toLocaleString() : '–'}</td>
      <td>${sum(r).toLocaleString()}${sum(r) ? `<small>${Object.entries(r.clicks).map(([k, n]) => `${esc(L.kinds[k] || k)} ${n}`).join(' · ')}</small>` : ''}</td></tr>`).join('');
  $('statsNote').textContent = stats.from ? L.statsNote(stats.from) : '';
}
document.querySelectorAll('.per').forEach(b => b.onclick = async () => {
  statDays = +b.dataset.days;
  const j = await post('me', { t: token, days: statDays }).catch(() => ({}));
  if (j.ok) { stats = j.stats; renderStats(); }
});

function showStatus() {
  const L = T[lang], box = $('statusBox');
  const map = { pending_new: ['pending', L.stPendingNew], pending_edit: ['pending', L.stPendingEdit], live: ['live', L.stLive + (expires ? L.expires(expires) : '')], hidden: ['', L.stHidden], bad: ['', L.badLink] };
  const s = map[editStatus];
  box.style.display = s ? '' : 'none';
  if (s) { box.className = 'status ' + s[0]; box.textContent = s[1]; }
}

(async () => {
  applyLang();
  await loadSpots();
  const pre = parseInt(new URLSearchParams(location.search).get('spot'), 10);
  if (!token && pre && !picked.includes(pre)) { picked.push(pre); renderChips(); }
  if (token) {
    const j = await post('me', { t: token }).catch(() => ({}));
    if (!j.ok) { editStatus = 'bad'; form.style.display = 'none'; showStatus(); return; }
    editStatus = j.status; expires = j.expires || ''; fill(j.data || {}, j.email); showStatus();
    stats = j.stats || null; renderStats();
  }
})();
</script>
</body>
