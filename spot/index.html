<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>포인트 등록 · otemp.app</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- [ADD] 새 다이빙 포인트(정점) 등록 요청 페이지. 위성 지도에서 바다 위 정확한 자리를 눌러 고르면,
     운영자가 /admin 에서 확인 후 번호를 붙여 사이트에 추가해요. -->
<style>
  :root { --bg:#070B14; --bg2:#0B1120; --line:rgba(255,255,255,.1); --text:rgba(255,255,255,.92); --muted:#8A94A6; --dim:#5B6474; --accent:#FFB000; --ok:#34D399; --err:#FB7185; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .top { display: flex; justify-content: space-between; } .top a { font-size: 13px; text-decoration: none; color: var(--muted); }
  h1 { font-size: 21px; margin: 10px 0 4px; } .lead { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 0 0 16px; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  #map { height: 360px; border-radius: 10px; border: 1px solid var(--line); }
  .pos { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .pos input { width: 130px; display: none; } body.is-admin .pos input { display: inline-block; } /* [CHANGE] 좌표 숫자는 관리자에게만 보임(일반 방문자는 지도 핀으로만) */
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; } label b { color: var(--accent); }
  select { width: 100%; font: inherit; font-size: 15px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  input, textarea { width: 100%; font: inherit; font-size: 15px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  textarea { min-height: 70px; } .hint { font-size: 11.5px; color: var(--dim); margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; } @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .btn { font: inherit; font-size: 15px; font-weight: 700; padding: 12px 18px; border-radius: 10px; border: 1px solid rgba(255,176,0,.6); background: rgba(255,176,0,.16); color: #ffd27a; cursor: pointer; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); font-size: 13px; padding: 7px 12px; font-weight: 600; }
  .msg { font-size: 13px; margin-top: 10px; } .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  .hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/" id="backLink">← otemp.app</a><a href="#" id="langBtn"></a></div>
  <h1 data-k="title"></h1>
  <p class="lead" data-k="lead"></p>
  <form id="f" novalidate>
    <div class="card">
      <div id="map"></div>
      <div class="pos"><span data-k="pos"></span>
        <input name="lat" id="lat" inputmode="decimal" placeholder="lat"><input name="lon" id="lon" inputmode="decimal" placeholder="lon">
        <button class="btn ghost" type="button" id="meBtn" data-k="me"></button></div>
      <div class="hint" data-k="posHint"></div>
    </div>
    <div class="card" id="catRow" style="display:none">
      <label>등록 종류 / Type</label>
      <select id="catSel"><option value="spot">포인트 · Spot</option><option value="shop">다이브샵 · Dive shop</option><option value="liveaboard">리브어보드 · Liveaboard</option><option value="pool">다이빙 풀장 · Dive pool</option></select>
      <div id="shopSpotsBox" style="display:none;margin-top:12px"><label id="shopSpotsLbl"></label><div id="shopSpots" style="max-height:220px;overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 10px"></div>
        <div class="hint" id="shopSpotsHint"></div></div>
    </div>
    <div class="card">
      <label><span data-k="name"></span> <b>*</b></label><input name="name" maxlength="80" data-ph="namePh">
      <div class="grid">
        <div><label data-k="label"></label><input name="label" maxlength="30" data-ph="labelPh"></div>
        <div><label data-k="country"></label><select id="countrySel"></select><input type="hidden" name="country" id="countryVal">
          <div class="hint" id="countryHint"></div></div>
      </div>
      <label data-k="note"></label><textarea name="note" maxlength="300" data-ph="notePh"></textarea>
      <label data-k="email"></label><input name="email" type="email" autocomplete="email">
      <div class="hint" data-k="emailHint"></div>
      <input class="hp" name="website2" tabindex="-1" autocomplete="off">
    </div>
    <button class="btn" type="submit" id="submitBtn" data-k="submit"></button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/shop/lists.js"></script>
<script>
const T = {
  ko: { title: '포인트 등록', lead: '사이트에 없는 포인트를 알려주세요. 운영자가 확인한 뒤 추가해요. 수온·파도·시야는 위성·관측 자료라서 꼭 바다 위 자리를 골라주세요.',
    pos: '위치', me: '내 위치', posHint: '위성 지도에서 실제로 들어가는 바다 위 자리를 누르세요(확대해서 정확하게).', posHintAdmin: '위성 지도에서 실제로 들어가는 바다 위 자리를 누르세요(확대해서 정확하게). 숫자를 직접 넣어도 돼요.',
    name: '포인트 이름', namePh: '예: 제주 문섬', label: '짧은 이름(지도 표시)', labelPh: '예: 문섬', country: '나라', countryAuto: '지도에서 고른 위치로 자동 선택했어요(가까운 포인트 기준). 틀리면 바꿔주세요.', countryBrowser: '브라우저 설정으로 자동 선택했어요. 위치를 고르면 다시 맞춰져요.',
    note: '설명', notePh: '수심, 입수 방법, 특징 등', email: '이메일(선택)', emailHint: '추가되면 알려드릴 수 있어요. 공개되지 않아요.',
    submit: '등록 요청 보내기', adminSubmit: '바로 등록 (관리자)', adminBar: '관리자로 로그인되어 있어요 - 승인 없이 바로 등록되고 하루 한도도 없어요.', adminOk: (n) => `#${n} 등록했어요. 사이트 목록에는 1~2분 안에 보여요.`, viewMap: '지도에서 보기', e_unauthorized: '관리자 로그인이 풀렸어요. 관리 페이지에서 다시 로그인해 주세요.', sending: '보내는 중…', ok: '요청을 보냈어요. 확인 후 사이트에 추가돼요. 고마워요!',
    e_need_name_pos: '이름과 지도 위치를 넣어주세요.', e_too_many: '오늘 보낼 수 있는 제안 수(30곳)를 넘었어요. 내일 다시 보내 주세요.', e_default: '보내지 못했어요. 잠시 후 다시 시도해 주세요.', other: 'English' },
  en: { title: 'Suggest a spot', lead: 'Tell us about a spot that is missing. We add it after review. Pick a point on the water, since temperature, waves and visibility come from satellite and sea observations.',
    pos: 'Position', me: 'My location', posHint: 'Tap the exact spot on the water where you dive (zoom in).', posHintAdmin: 'Tap the exact spot on the water where you dive (zoom in). You can also type coordinates.',
    name: 'Spot name', namePh: 'e.g. Moonseom, Jeju', label: 'Short name (map label)', labelPh: 'e.g. Moonseom', country: 'Country', countryAuto: 'Picked automatically from the map position (nearest spot). Change it if wrong.', countryBrowser: 'Picked from your browser settings. It updates when you choose a position.',
    note: 'Notes', notePh: 'Depth, entry, highlights…', email: 'Email (optional)', emailHint: 'So we can tell you when it is added. Not shown publicly.',
    submit: 'Send suggestion', adminSubmit: 'Add now (admin)', adminBar: 'Signed in as admin - spots are added right away, no review or daily limit.', adminOk: (n) => `Added #${n}. It shows on the site within 1-2 minutes.`, viewMap: 'View on map', e_unauthorized: 'Admin sign-in expired. Sign in again on the admin page.', sending: 'Sending…', ok: 'Sent! We will add it after review. Thank you!',
    e_need_name_pos: 'Add a name and a position on the map.', e_too_many: 'You reached today\'s limit (30 suggestions). Please try again tomorrow.', e_default: 'Could not send. Please try again later.', other: '한국어' }
};
let lang = (() => { try { return localStorage.getItem('otemp.lang') || (navigator.language || '').slice(0, 2); } catch (_) { return 'ko'; } })() === 'ko' ? 'ko' : 'en';
const $ = (id) => document.getElementById(id);
function applyLang() {
  const L = T[lang]; document.documentElement.lang = lang; document.title = L.title + ' · otemp.app';
  document.querySelectorAll('[data-k]').forEach(el => { const v = L[el.dataset.k]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = L[el.dataset.ph] || ''; });
  $('langBtn').textContent = L.other;
  if (window.__countryReady) renderCountries();
}
$('langBtn').onclick = (e) => { e.preventDefault(); lang = lang === 'ko' ? 'en' : 'ko'; applyLang(); };
applyLang();

const qs = new URLSearchParams(location.search);
const lat0 = parseFloat(qs.get('lat')), lon0 = parseFloat(qs.get('lon'));
const has0 = Number.isFinite(lat0) && Number.isFinite(lon0);
const z0 = parseFloat(qs.get('z'));
const map = L.map('map', { attributionControl: true }).setView(has0 ? [lat0, lon0] : [33.3, 126.5], has0 ? (Number.isFinite(z0) ? Math.max(12, Math.min(18, z0)) : 15) : 6);
// [ADD] "← otemp.app": 지금 보고 있는 지도 자리(가운데·확대)로 사이트 지도를 열기
$('backLink').addEventListener('click', () => { if (!has0 && !pin) return; const c = map.getCenter(); $('backLink').href = `/?lat=${c.lat.toFixed(5)}&lon=${c.lng.toFixed(5)}&z=${map.getZoom()}`; });
map.attributionControl.setPrefix(false);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Labels © Esri' }).addTo(map);
let pin = null;
// ── [ADD] 나라: 목록에서 고르기. 위치를 고르면 가장 가까운 포인트(500km 안)의 나라로 자동 선택 ──
let country = '', countryHow = '', userPickedCountry = false, knownSpots = [];
function renderCountries() {
  const L = T[lang], sel = $('countrySel');
  const ui = OTLists.uiLocale(); // [CHANGE] 나라 이름은 브라우저 언어로
  const items = OTLists.REGIONS.map(c => [c, OTLists.regionIn(c, ui)]).sort((a, b) => a[1].localeCompare(b[1], ui));
  sel.innerHTML = `<option value="">—</option>` + items.map(([c, n]) => `<option value="${c}"${c === country ? ' selected' : ''}>${n.replace(/[<>&]/g, '')}</option>`).join('');
  $('countryVal').value = country ? OTLists.regionEnglish(country) : ''; // 시트와 같은 영어 이름으로 저장
  $('countryHint').textContent = countryHow === 'map' ? L.countryAuto : countryHow === 'browser' ? L.countryBrowser : '';
}
$('countrySel').onchange = () => { country = $('countrySel').value; countryHow = ''; userPickedCountry = true; renderCountries(); };
function autoCountry(la, lo) {
  if (userPickedCountry || !knownSpots.length) return;
  const R = 6371, rad = Math.PI / 180;
  let best = null, bd = Infinity;
  knownSpots.forEach(s => { const d = 2 * R * Math.asin(Math.sqrt(Math.sin((s.lat - la) * rad / 2) ** 2 + Math.cos(la * rad) * Math.cos(s.lat * rad) * Math.sin((s.lon - lo) * rad / 2) ** 2)); if (d < bd) { bd = d; best = s; } });
  if (best && bd < 500 && best.code) { country = best.code; countryHow = 'map'; renderCountries(); }
}
country = OTLists.browserRegion(); countryHow = country ? 'browser' : ''; window.__countryReady = true; renderCountries();
(async () => { // 알려진 포인트 목록 - 나라 자동 선택용 [CHANGE] /api/shops?svc=spots 하나로
  try {
    const ex = await fetch('/api/shops?svc=spots').then(r => r.json()).catch(() => ({}));
    (ex.spots || []).forEach(s => knownSpots.push({ lat: +s.lat, lon: +s.lon, code: OTLists.regionCode(s.country), no: +s.no, name: s.label || s.name }));
    if ($('lat').value) autoCountry(+$('lat').value, +$('lon').value);
  } catch (_) {}
})();

function setPos(la, lo, move) {
  la = +(+la).toFixed(5); lo = +(L.Util.wrapNum(+lo, [-180, 180], true)).toFixed(5);
  autoCountry(la, lo);
  $('lat').value = la; $('lon').value = lo;
  if (!pin) pin = L.circleMarker([la, lo], { radius: 8, color: '#fff', weight: 2.5, fillColor: '#ef4444', fillOpacity: 1 }).addTo(map);
  pin.setLatLng([la, lo]); if (move) map.setView([la, lo], Math.max(map.getZoom(), 14));
  if (typeof renderShopSpots === 'function' && window.__catReady && cat() !== 'spot') renderShopSpots(); // 샵 위치가 바뀌면 가까운 포인트 다시
}
if (has0) setPos(lat0, lon0);
// [ADD] 미리 채우기: /spot/?lat=..&lon=..&name=..&label=..&note=.. (여러 포인트를 링크로 빠르게 등록할 때)
['name', 'label', 'note'].forEach(k => { const v = qs.get(k); const el = document.querySelector(`#f [name="${k}"]`); if (v && el) el.value = v.slice(0, +el.maxLength > 0 ? +el.maxLength : 300); });
map.on('click', (e) => setPos(e.latlng.lat, e.latlng.lng));
['lat', 'lon'].forEach(id => $(id).onchange = () => { const a = parseFloat($('lat').value), b = parseFloat($('lon').value); if (Number.isFinite(a) && Number.isFinite(b)) setPos(a, b, true); });
$('meBtn').onclick = () => navigator.geolocation && navigator.geolocation.getCurrentPosition(p => setPos(p.coords.latitude, p.coords.longitude, true), () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });

// [ADD] 관리자 로그인 상태(같은 탭의 관리 페이지 비밀번호)면 승인 대기 없이 바로 등록
let adminPw = (() => { try { const o = JSON.parse(localStorage.getItem('otemp.admin') || 'null'); if (o && o.pw && o.exp > Date.now()) return o.pw; } catch (_) {} try { return sessionStorage.getItem('adminPw') || ''; } catch (_) { return ''; } })();
// 저장된 비밀번호가 아직 맞는지 서버에 확인한 뒤에만 관리자 모드로(틀리면 일반 등록 요청)
let adminOk = false;
// [FIX] 관리자 권한 회원으로 로그인(쿠키)한 경우도 관리자 모드 - 저장된 비밀번호가 없어도 서버에 물어봄
fetch('/api/stats?svc=settings', { credentials: 'same-origin', headers: adminPw ? { 'x-admin-password': adminPw } : {} }).then(r => { adminOk = r.ok; if (!r.ok) adminPw = ''; applyAdmin(); }).catch(() => {});
function applyAdmin() {
  if (!adminOk) return;
  const L = T[lang]; $('submitBtn').textContent = L.adminSubmit;
  let bar = $('adminBar'); if (!bar) { bar = document.createElement('div'); bar.id = 'adminBar'; bar.className = 'msg ok'; bar.style.margin = '0 0 14px'; $('f').parentNode.insertBefore(bar, $('f')); }
  bar.textContent = L.adminBar;
  $('catRow').style.display = ''; // 관리자만: 등록 종류 고르기
  document.body.classList.add('is-admin'); // [ADD] 관리자만 좌표 숫자 보기·입력
  const ph = document.querySelector('[data-k="posHint"]'); if (ph && L.posHintAdmin) ph.textContent = L.posHintAdmin;
}
applyAdmin(); document.addEventListener('click', (e) => { if (e.target && e.target.id === 'langBtn') setTimeout(applyAdmin, 0); });

// [ADD] 관리자: 같은 화면·같은 GPS로 다이브샵·리브어보드·풀장도 바로 등록
const cat = () => (adminOk ? $('catSel').value : 'spot');
const kmTo = (la, lo, s) => { const R = 6371, r = Math.PI / 180; return 2 * R * Math.asin(Math.sqrt(Math.sin((s.lat - la) * r / 2) ** 2 + Math.cos(la * r) * Math.cos(s.lat * r) * Math.sin((s.lon - lo) * r / 2) ** 2)); };
function renderShopSpots() {
  const c = cat(), shopLike = c === 'shop' || c === 'liveaboard', ko = lang === 'ko';
  $('shopSpotsBox').style.display = shopLike ? '' : 'none';
  document.querySelectorAll('#f .grid')[0].style.display = c === 'spot' ? '' : 'none'; // 짧은 이름·나라는 포인트만
  const nm = document.querySelector('[data-k="name"]'); if (nm) nm.textContent = c === 'spot' ? T[lang].name : c === 'pool' ? (ko ? '풀장 이름' : 'Pool name') : (ko ? '샵 이름' : 'Shop name');
  if (!shopLike) return;
  const max = c === 'liveaboard' ? 40 : 20, la = parseFloat($('lat').value), lo = parseFloat($('lon').value);
  $('shopSpotsLbl').textContent = ko ? `연결할 포인트 (가까운 순, 최대 ${max}곳)` : `Linked spots (nearest first, up to ${max})`;
  if (!Number.isFinite(la)) { $('shopSpots').innerHTML = ''; $('shopSpotsHint').textContent = ko ? '먼저 지도에서 샵 위치를 찍어주세요.' : 'Pick the shop location on the map first.'; return; }
  const keep = new Set([...document.querySelectorAll('#shopSpots input:checked')].map(i => +i.value));
  const list = knownSpots.filter(s => s.no).map(s => ({ s, d: kmTo(la, lo, s) })).filter(x => x.d <= 60).sort((a, b) => a.d - b.d).slice(0, 60);
  const first = !$('shopSpots').dataset.init; $('shopSpots').dataset.init = '1';
  $('shopSpots').innerHTML = list.map(({ s, d }) => `<label style="display:flex;gap:8px;align-items:center;margin:4px 0;font-weight:400"><input type="checkbox" value="${s.no}" style="width:auto" ${keep.has(s.no) || (first && d <= 5) ? 'checked' : ''}> ${String(s.name).replace(/[<>&]/g, '')} <span style="opacity:.6;font-size:12px">${d < 1 ? Math.round(d * 1000) + 'm' : d.toFixed(1) + 'km'}</span></label>`).join('');
  $('shopSpotsHint').textContent = ko ? '5km 안 포인트는 미리 체크했어요. 연락처·소개·요금제는 등록 뒤 관리 페이지에서 고칠 수 있어요.' : 'Spots within 5 km are pre-checked. Contacts and plan can be edited in admin later.';
}
$('catSel').onchange = () => { $('shopSpots').dataset.init = ''; renderShopSpots(); };
['lat', 'lon'].forEach(id => $(id).addEventListener('change', () => cat() !== 'spot' && renderShopSpots()));
window.__catReady = true;
async function adminShopSave(c) {
  const fd = Object.fromEntries(new FormData($('f')).entries()), ko = lang === 'ko';
  const spots = [...document.querySelectorAll('#shopSpots input:checked')].map(i => +i.value);
  const max = c === 'liveaboard' ? 40 : 20;
  if (c !== 'pool' && !spots.length) return { ok: false, msg: ko ? '연결할 포인트를 하나 이상 골라주세요.' : 'Pick at least one spot.' };
  if (spots.length > max) return { ok: false, msg: ko ? `포인트는 ${max}곳까지예요.` : `Up to ${max} spots.` };
  const body = { type: c, name: fd.name, note: fd.note, lat: fd.lat, lon: fd.lon, spots: c === 'pool' ? [] : spots, email: fd.email || '', show: true };
  const r = await fetch('/api/stats?svc=shopSave', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPw }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (_) {}
  return j.ok ? j : { ok: false, msg: j.error === 'need_name_loc' ? (ko ? '풀장 이름과 위치를 넣어주세요.' : 'Add a pool name and location.') : (j.error || (ko ? '등록하지 못했어요.' : 'Could not save.')) };
}
$('f').onsubmit = async (e) => {
  e.preventDefault();
  const L = T[lang], btn = $('submitBtn'), msg = $('msg');
  const body = Object.fromEntries(new FormData(e.target).entries());
  btn.disabled = true; btn.textContent = L.sending; msg.textContent = '';
  if (cat() !== 'spot') { // 관리자: 샵·리브어보드·풀장 바로 등록
    const a = await adminShopSave(cat()).catch(() => ({ ok: false }));
    btn.disabled = false; btn.textContent = L.adminSubmit;
    if (!a.ok) { msg.className = 'msg err'; msg.textContent = a.msg || L.e_default; return; }
    msg.className = 'msg ok'; msg.innerHTML = ''; msg.append((lang === 'ko' ? `샵 #${a.id} 바로 게시했어요. ` : `Published shop #${a.id}. `));
    const l = document.createElement('a'); l.href = '/admin/#shops'; l.target = '_blank'; l.textContent = lang === 'ko' ? '관리 페이지에서 보기' : 'Open admin'; msg.append(l);
    ['name', 'note'].forEach(k => { const el = document.querySelector(`#f [name="${k}"]`); if (el) el.value = ''; }); $('shopSpots').dataset.init = ''; renderShopSpots();
    return;
  }
  let j = {};
  try {
    const r = adminOk
      ? await fetch('/api/stats?svc=spotAdd', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPw }, body: JSON.stringify(body) })
      : await fetch('/api/shops?svc=spot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    j = await r.json(); if (r.status === 401) j = { ok: false, error: 'unauthorized' };
  } catch (_) {}
  btn.disabled = false; btn.textContent = adminOk ? L.adminSubmit : L.submit;
  if (!j.ok) { msg.className = 'msg err'; msg.textContent = L['e_' + j.error] || L.e_default; return; }
  msg.className = 'msg ok';
  if (adminOk && j.no) { msg.innerHTML = ''; msg.append(L.adminOk(j.no) + ' '); const a = document.createElement('a'); a.href = '/?no=' + j.no; a.target = '_blank'; a.textContent = L.viewMap; msg.append(a); }
  else msg.textContent = L.ok;
  e.target.reset(); renderCountries(); if (pin) { map.removeLayer(pin); pin = null; }
};
</script>
</body>
